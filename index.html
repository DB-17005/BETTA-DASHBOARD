<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log-In Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="form">
      <form action="">
        <div id="logo"><i class="fa-solid fa-circle-user"></i></div>
        <div id="username">
          <input type="text" placeholder="username" required />
          <i class="fa-regular fa-user"></i>
        </div>
        <div id="password">
          <input type="password" placeholder="⋅⋅⋅⋅⋅⋅⋅⋅⋅" required />
          <i class="fa-solid fa-lock"></i>
        </div>
        <div id="button"><input type="submit" /></div>
        <div id="remember">
          <div><input type="checkbox" />Remeber me</div>
          <button>Forgot password?</button>
        </div>
      </form>
    </div>
  </body>
</html>
